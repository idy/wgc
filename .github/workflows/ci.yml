name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            go: '1.25.x'
          - runner: ubuntu-24.04
            go: stable
          - runner: macos-15
            go: stable
          - runner: windows-2025
            go: stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - name: Verify dependencies
        run: go mod verify
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Race tests
        run: go test -race ./...
      - name: Small buffer pool tests
        run: go test -tags BUFPOOL_MINI ./...
      - name: Vet
        run: go vet ./...
      - name: Local encrypted echo
        run: go run ./examples/echo
